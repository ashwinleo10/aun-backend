spring.application.name=Aun

server.port=8080

# ===============================
# Database
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aun}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update

# ===============================
# Security
# ===============================
spring.security.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:your-very-long-secure-secret-key-for-local-development-only-1234567890}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ===============================
# CORS
# ===============================
spring.web.cors.allowed-origin-patterns=${CORS_ORIGIN:http://localhost:5173}

spring.web.cors.exposed-headers=*

spring.web.cors.max-age=36000

spring.web.cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173}

spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

spring.web.cors.allowed-headers=Content-Type,Authorization

spring.web.cors.allow-credentials=true

# ===============================
# Admin
# ===============================
app.admin.setup-secret=${AUN_ADMIN_SETUP_SECRET:}

# ===============================
# Payment
# ===============================
app.payment.pending-expiry-minutes=30

# Razorpay Test Mode Configuration
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# Razorpay Webhook Secret
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}